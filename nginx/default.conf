# 정적 파일 요청(404·캐시 문제)을 백엔드 로그와 같은 방식으로 보기 위한 JSON access log.
# 공식 nginx 이미지는 /var/log/nginx/access.log를 /dev/stdout으로 심볼릭 링크해 둔다 —
# docker-compose가 이 디렉터리를 바인드 마운트하면 링크가 실제 파일로 대체되므로,
# `docker compose logs web`에서도 계속 보이도록 stdout 출력을 한 줄 더 남긴다.
map $status $mcp_log_level {
    default "INFO";
    ~^4     "WARNING";
    ~^5     "ERROR";
}

log_format mcp_json escape=json
    '{"ts":"$time_iso8601","level":"$mcp_log_level","logger":"nginx",'
    '"method":"$request_method","path":"$uri","status":$status,'
    '"duration_s":$request_time,"bytes":$body_bytes_sent,'
    '"client_ip":"$remote_addr","referer":"$http_referer","user_agent":"$http_user_agent"}';

server {
    listen 80;
    access_log /var/log/nginx/access.log mcp_json;
    access_log /dev/stdout mcp_json;
    server_name _;
    root /usr/share/nginx/html;
    index main.html;

    # 주소창에 .html 확장자를 보이지 않는다(2026-09-29) — 화면 주소는 /login, /cost처럼 쓴다.
    # 예전 주소(북마크·이미 발송된 메일의 /password-reset.html?token=...)는 확장자 없는 주소로
    # 301 리다이렉트해 계속 동작하게 한다. $uri가 아니라 $request_uri(클라이언트가 보낸 원래
    # 주소)로 검사해야, 아래 try_files가 /login을 login.html로 내부 처리할 때 루프가 생기지 않는다.
    # 쿼리스트링은 $2로 그대로 넘긴다. "/"는 index(main.html)로 그대로 둔다.
    # absolute_redirect off — Location을 "/login"처럼 상대 주소로 보낸다. 기본값(on)이면 이 컨테이너가
    # 아는 scheme·포트로 "http://호스트/login"을 만들어, 앞단 HTTPS 프록시 뒤에서 https→http로 떨어진다.
    absolute_redirect off;
    if ($request_uri ~ ^/([^?]*)\.html(\?.*)?$) {
        return 301 /$1$2;
    }

    # API를 같은 오리진(/api/)으로 합친다 — 프론트(assets/js/api.js)가 상대경로 "/api/v1"을
    # 쓰는 이유다. 브라우저 입장에서 동일 출처라 CORS preflight가 아예 발생하지 않고, 배포
    # 주소(IP·도메인)가 바뀌어도 고칠 코드가 없으며, 외부에 8000 포트를 열 필요도 없다.
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # app/main.py의 _client_ip()가 이 헤더의 첫 값을 client_ip로 로깅한다(없으면 프록시 IP가 남는다).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 프로비저닝 job 생성 등 terraform/CSP API를 타는 요청은 기본 60초로는 부족할 수 있다.
        proxy_read_timeout 120s;
    }

    # /login → login.html 파일로 응답(주소는 /login 그대로). 없는 주소는 예전처럼 main.html.
    # 확장자 없는 HTML은 아래 정규식 location에 걸리지 않으므로 no-cache를 여기서도 붙인다.
    location / {
        try_files $uri $uri.html $uri/ /main.html;
        add_header Cache-Control "no-cache";
    }

    # 프론트는 빌드 단계가 없어 파일명에 해시가 붙지 않는다(mypage.js는 계속 mypage.js).
    # 즉 캐시를 무효화할 수단이 파일명에 없다. 그런데 Cache-Control이 아예 없으면 브라우저가
    # 휴리스틱 캐싱을 해서 서버에 물어보지도 않고 옛 파일을 쓴다 — 코드를 고쳐도 하드 리로드
    # 전까지 반영이 안 되는 것처럼 보인다(2026-09-15에 실제로 겪음).
    # no-cache는 "캐시하지 마라"가 아니라 "쓰기 전에 항상 서버에 확인해라"다. ETag가 같으면
    # 304로 끝나므로 전송량은 거의 늘지 않는다.
    location ~* \.(js|css)$ {
        add_header Cache-Control "no-cache";
    }
}
