# 검증용 nginx (8081) — 코드 수정 없이 프론트가 복사본 API(mcp-api-verify)를 보게 한다.
#  1) api.js의 API_BASE "http://localhost:8000/api/v1" 을 같은 오리진 "/api/v1" 로 바꿔 내려준다(sub_filter)
#  2) /api/ 요청은 측면 컨테이너로 프록시한다 → 같은 오리진이라 CORS(백엔드는 8080만 허용)에 걸리지 않는다
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index main.html;
    add_header Cache-Control "no-store" always;

    location /api/ {
        proxy_pass http://mcp-api-verify:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location ~* \.js$ {
        sub_filter "http://localhost:8000/api/v1" "/api/v1";
        sub_filter_once off;
        sub_filter_types application/javascript text/javascript;
        gzip off;
    }
    location / {
        try_files $uri $uri/ /main.html;
    }
}
