services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      # 운영(EC2)은 .env에 DB_BIND_HOST=127.0.0.1을 넣어 외부에서 닿지 않게 한다 — api는 compose
      # 네트워크로 붙으므로 퍼블리시 자체가 필요 없고, 이 값은 호스트에서 psql로 들여다볼 때만 쓴다.
      # 로컬은 미설정 → 0.0.0.0(지금까지와 동일, DBeaver/pytest가 localhost:5432로 붙는다).
      - "${DB_BIND_HOST:-0.0.0.0}:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      # 시크릿은 fallback 기본값을 두지 않는다 — .env에 반드시 지정해야 하며,
      # 없으면 컨테이너가 기동에 실패한다(secret을 커밋에 남기지 않기 위함).
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?set CREDENTIAL_ENCRYPTION_KEY in .env}
      CREDENTIAL_ENCRYPTION_KEY_VERSION: ${CREDENTIAL_ENCRYPTION_KEY_VERSION:-v1}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_TOKEN_EXPIRES_SECONDS: ${JWT_ACCESS_TOKEN_EXPIRES_SECONDS:-3600}
      REFRESH_TOKEN_EXPIRES_SECONDS: ${REFRESH_TOKEN_EXPIRES_SECONDS:-1209600}
      MAIL_HOST: ${MAIL_HOST:-mailhog}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@multicloud.example}
      MAIL_USE_TLS: ${MAIL_USE_TLS:-false}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:8080}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      PLATFORM_AWS_ACCOUNT_ID: ${PLATFORM_AWS_ACCOUNT_ID:-}
      PLATFORM_AWS_ACCESS_KEY_ID: ${PLATFORM_AWS_ACCESS_KEY_ID:-}
      PLATFORM_AWS_SECRET_ACCESS_KEY: ${PLATFORM_AWS_SECRET_ACCESS_KEY:-}
      PLATFORM_AWS_ASSUMABLE_ROLE_PATTERN: ${PLATFORM_AWS_ASSUMABLE_ROLE_PATTERN:-arn:aws:iam::*:role/MultiCloudOps*}
      PLATFORM_AWS_SESSION_DURATION_SECONDS: ${PLATFORM_AWS_SESSION_DURATION_SECONDS:-3600}
      # 하루 1회 자동 비용 수집(app/cost/scheduler.py). 기본 켜짐 — pytest는 이 env를 세팅하지
      # 않으므로 코드 쪽 기본값(false)이 적용돼 테스트 중에는 돌지 않는다.
      COST_SCHEDULER_ENABLED: ${COST_SCHEDULER_ENABLED:-true}
      COST_INGEST_HOUR_UTC: ${COST_INGEST_HOUR_UTC:-6}
      # 어느 CSP를 실제로 호출할지(app/cost/gating.py). 어댑터 등록(구현 지원)과는 별개다 —
      # 새 CSP 어댑터를 추가해도 이 값을 바꾸기 전에는 수동·자동 수집 모두 호출이 0건이다.
      # 수동과 자동은 독립이며, azure·gcp는 COST_INGEST_ACCOUNT_IDS에 계정을 명시해야 켜진다
      # (빈 목록은 "전체 허용"이 아니라 "한 계정도 허용 안 함"이다).
      # ⚠️ `:-`가 아니라 `-`를 쓴다. `${VAR:-aws}`는 **빈 문자열까지** aws로 치환해서
      # "명시적으로 비워서 전부 끄기"가 불가능해진다(docker compose config로 재현함).
      # `${VAR-aws}`는 변수를 지정하지 않았을 때만 aws이고, 빈 문자열은 빈 문자열 그대로 간다.
      COST_INGEST_PROVIDERS: ${COST_INGEST_PROVIDERS-aws}
      COST_AUTO_INGEST_PROVIDERS: ${COST_AUTO_INGEST_PROVIDERS-aws}
      COST_INGEST_ACCOUNT_IDS: ${COST_INGEST_ACCOUNT_IDS-}
      # 보고서 정기 메일 발송(app/report_scheduler.py, 2026-09-19). 테스트는 이 env를 세팅하지
      # 않으므로 코드 쪽 기본값(false)이 적용돼 테스트 중에는 돌지 않는다.
      REPORT_SCHEDULER_ENABLED: ${REPORT_SCHEDULER_ENABLED:-true}
      REPORT_SEND_HOUR_UTC: ${REPORT_SEND_HOUR_UTC:-7}
      COST_STALE_AFTER_HOURS: ${COST_STALE_AFTER_HOURS:-36}
      TERRAFORM_WORKSPACES_DIR: /app/terraform_workspaces
      TERRAFORM_PLUGIN_CACHE_DIR: /app/terraform_plugin_cache
      LOG_DIR: ${LOG_DIR:-/app/logs}
      # 컨테이너 콘솔 출력용. 로그 파일의 ts는 이 값과 무관하게 app/logging_config.py가
      # 고정 오프셋(+09:00)으로 찍는다(slim 이미지에 tzdata가 없어도 되도록).
      TZ: ${TZ:-Asia/Seoul}
    volumes:
      - terraform_workspaces:/app/terraform_workspaces
      - terraform_plugin_cache:/app/terraform_plugin_cache
      # named volume이 아니라 바인드 마운트인 이유: 관제를 서버에서 직접 한다 —
      # `docker exec` 없이 호스트에서 바로 `tail -f logs/app.log` 할 수 있어야 한다.
      # 컨테이너는 uid 1000(appuser)으로 돌므로 리눅스 서버에서는 `chown 1000:1000 logs`가 필요하다.
      # (쓰기 불가 시 app/logging_config.py가 stderr로 폴백하므로 기동 자체는 막히지 않는다.)
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    ports:
      # 운영은 .env에 API_BIND_HOST=127.0.0.1 — 외부 접근은 nginx의 /api/ 프록시로만 받는다
      # (보안 그룹에서 8000을 열지 않는 것과 같은 의도를 호스트 쪽에서 한 번 더 건다).
      - "${API_BIND_HOST:-0.0.0.0}:8000:8000"

  # 로컬/데모 전용 가짜 SMTP — 나가는 메일을 가로채 웹 UI(:8025)에서 확인한다.
  # 운영에서는 이 서비스를 띄우지 않는다 — `docker compose up -d db api web`처럼 서비스를 명시하거나,
  # 띄우더라도 .env의 MAILHOG_BIND_HOST=127.0.0.1로 외부 노출만 막는다(MAIL_*가 실제 SMTP를 가리키면
  # 컨테이너가 떠 있어도 아무도 쓰지 않는다). ⚠️ MAIL_HOST 기본값이 `mailhog`이므로, 운영 .env에
  # MAIL_HOST를 지정하지 않으면 메일이 조용히 MailHog로 들어가거나(떠 있을 때) 실패한다(없을 때).
  mailhog:
    image: mailhog/mailhog:v1.0.1
    restart: unless-stopped
    ports:
      - "${MAILHOG_BIND_HOST:-0.0.0.0}:1025:1025"
      - "${MAILHOG_BIND_HOST:-0.0.0.0}:8025:8025"

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    # nginx의 $time_iso8601은 컨테이너 로컬 시각을 쓴다 — api 로그와 시간대를 맞춘다.
    environment:
      TZ: ${TZ:-Asia/Seoul}
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # 엣지 로그도 같은 자리에 모은다 — logs/nginx/access.log (JSON Lines, api와 동일 포맷)
      - ./logs/nginx:/var/log/nginx
    ports:
      # 운영(.env): WEB_PORT=80 → http://mcp.greatsounds.me 로 포트 없이 접속.
      # 로컬은 미설정 시 8080 그대로. 80으로 쓰고 싶으면 각자 .env에 WEB_PORT=80만 넣으면 되고
      # (이미지 재빌드 불필요, `docker compose up -d`로 컨테이너만 재생성되면 반영된다),
      # 그때는 브라우저 Origin이 http://localhost가 되므로 app/main.py의 CORS 목록에 이미 넣어 뒀다.
      # ⚠️ 80번을 이미 쓰는 프로세스가 있으면 `bind: address already in use`로 기동에 실패한다.
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api

volumes:
  db_data:
  terraform_workspaces:
  terraform_plugin_cache:
