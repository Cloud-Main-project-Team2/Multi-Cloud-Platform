services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mcp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-mcp_db}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mcp_user} -d ${POSTGRES_DB:-mcp_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://mcp_user:change_me@db:5432/mcp_db}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-ItGuIvwBa1vpQkpSuONI0GHpbxwtSxL8UPh4dp340ak=}
      CREDENTIAL_ENCRYPTION_KEY_VERSION: ${CREDENTIAL_ENCRYPTION_KEY_VERSION:-v1}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-jwt-secret-change-me}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_TOKEN_EXPIRES_SECONDS: ${JWT_ACCESS_TOKEN_EXPIRES_SECONDS:-3600}
      REFRESH_TOKEN_EXPIRES_SECONDS: ${REFRESH_TOKEN_EXPIRES_SECONDS:-1209600}
      MAIL_HOST: ${MAIL_HOST:-mailhog}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@multicloud.example}
      MAIL_USE_TLS: ${MAIL_USE_TLS:-false}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:8080}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      PLATFORM_AWS_ACCOUNT_ID: ${PLATFORM_AWS_ACCOUNT_ID:-}
      PLATFORM_AWS_ACCESS_KEY_ID: ${PLATFORM_AWS_ACCESS_KEY_ID:-}
      PLATFORM_AWS_SECRET_ACCESS_KEY: ${PLATFORM_AWS_SECRET_ACCESS_KEY:-}
      PLATFORM_AWS_ASSUMABLE_ROLE_PATTERN: ${PLATFORM_AWS_ASSUMABLE_ROLE_PATTERN:-arn:aws:iam::*:role/MultiCloudOps*}
      PLATFORM_AWS_SESSION_DURATION_SECONDS: ${PLATFORM_AWS_SESSION_DURATION_SECONDS:-3600}
      TERRAFORM_WORKSPACES_DIR: /app/terraform_workspaces
      TERRAFORM_PLUGIN_CACHE_DIR: /app/terraform_plugin_cache
      LOG_DIR: ${LOG_DIR:-/app/logs}
    volumes:
      - terraform_workspaces:/app/terraform_workspaces
      - terraform_plugin_cache:/app/terraform_plugin_cache
      # named volume이 아니라 바인드 마운트인 이유: 관제를 서버에서 직접 한다 —
      # `docker exec` 없이 호스트에서 바로 `tail -f logs/app.log` 할 수 있어야 한다.
      # 컨테이너는 uid 1000(appuser)으로 돌므로 리눅스 서버에서는 `chown 1000:1000 logs`가 필요하다.
      # (쓰기 불가 시 app/logging_config.py가 stderr로 폴백하므로 기동 자체는 막히지 않는다.)
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  # 로컬/데모 전용 가짜 SMTP — 나가는 메일을 가로채 웹 UI(:8025)에서 확인한다.
  # 운영에서는 이 서비스를 빼고 api의 MAIL_* env를 실제 SMTP로 지정한다.
  mailhog:
    image: mailhog/mailhog:v1.0.1
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # 엣지 로그도 같은 자리에 모은다 — logs/nginx/access.log (JSON Lines, api와 동일 포맷)
      - ./logs/nginx:/var/log/nginx
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  db_data:
  terraform_workspaces:
  terraform_plugin_cache:
