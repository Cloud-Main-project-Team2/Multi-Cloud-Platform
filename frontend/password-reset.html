<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>비밀번호 찾기 · MultiCloud Ops</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: {
        background: "var(--background)", foreground: "var(--foreground)", surface: "var(--surface)",
        muted: "var(--muted)", "muted-foreground": "var(--muted-foreground)", border: "var(--border)",
        sidebar: "var(--sidebar)", "sidebar-accent": "var(--sidebar-accent)",
        primary: "var(--primary)", sky: "var(--sky)", aero: "var(--aero)",
        yellow: "var(--yellow)", "cta-text": "var(--cta-text)"
      }, maxWidth: { content: "1180px" } } }
    };
  </script>
  <link rel="icon" type="image/png" href="assets/imgs/logo-navy.png" />
  <link rel="stylesheet" href="assets/css/theme.css" />
</head>
<body class="min-h-screen">

  <!-- 상단 바: 로고(홈) + 테마 토글 -->
  <div class="mx-auto flex max-w-content items-center justify-between px-6 py-5">
    <a href="main.html" class="flex items-center gap-2">
      <img src="assets/imgs/logo.png" alt="" class="h-8 w-8 object-contain" />
      <span class="text-lg font-bold" data-service-name>MultiCloud Ops</span>
    </a>
    <button type="button" data-theme-toggle onclick="MCUI.toggleTheme()"
      class="grid h-9 w-9 place-items-center rounded-lg text-lg hover:bg-muted" aria-label="테마 전환">🌙</button>
  </div>

  <main class="mx-auto max-w-content px-6 py-8 md:py-12">
    <h1 class="text-2xl font-bold">비밀번호 찾기</h1>
    <p class="mt-1 text-sm text-muted-foreground">가입한 이메일로 재설정 링크를 받고, 새 비밀번호로 변경합니다.</p>

    <!-- STEP 1 / STEP 2 나란히 (정적으로 두 단계 모두 노출) -->
    <div class="mt-8 grid gap-6 md:grid-cols-2">

      <!-- STEP 1 -->
      <section class="rounded-2xl border border-border bg-surface p-8 shadow-sm">
        <div class="flex items-center gap-2">
          <span class="grid h-7 w-7 place-items-center rounded-full bg-primary text-sm font-bold text-white">1</span>
          <h2 class="text-lg font-semibold">이메일로 재설정 링크 받기</h2>
        </div>

        <form id="reset-step1-form" class="mt-5 space-y-4">
          <div>
            <label for="reset-email" class="mb-1 block text-sm font-medium">이메일</label>
            <input id="reset-email" type="email" placeholder="name@company.com" autocomplete="username"
              class="w-full rounded-lg border border-border bg-background px-3 py-2.5 text-sm outline-none focus:border-primary" />
          </div>
          <button id="reset-send-btn" type="submit" class="w-full rounded-lg bg-primary py-2.5 text-sm font-semibold text-white hover:opacity-90">재설정 링크 보내기</button>
        </form>

        <!-- 발송 완료 안내 (기본 숨김 — 발송 후 노출) -->
        <div id="reset-sent-note" class="mt-4 hidden items-start gap-2 rounded-lg border border-border bg-background px-3 py-2.5 text-sm text-muted-foreground">
          <span class="text-primary">✉️</span>
          <span>입력하신 주소로 메일을 보냈습니다. 5분 내 도착하지 않으면 다시 요청해 주세요.</span>
        </div>
      </section>

      <!-- STEP 2 -->
      <section class="rounded-2xl border border-border bg-surface p-8 shadow-sm">
        <div class="flex items-center gap-2">
          <span class="grid h-7 w-7 place-items-center rounded-full bg-primary text-sm font-bold text-white">2</span>
          <h2 class="text-lg font-semibold">새 비밀번호 설정</h2>
        </div>

        <form id="reset-step2-form" class="mt-5 space-y-4">
          <div>
            <label for="new-password" class="mb-1 block text-sm font-medium">새 비밀번호</label>
            <div class="relative">
              <input id="new-password" type="password" placeholder="8자 이상, 영문·숫자·기호 중 2종 이상" autocomplete="new-password"
                class="w-full rounded-lg border border-border bg-background px-3 py-2.5 pr-10 text-sm outline-none focus:border-primary" />
              <button type="button" onclick="MCUI.togglePassword('new-password', this)"
                class="absolute right-2 top-1/2 -translate-y-1/2 grid h-7 w-7 place-items-center rounded text-base hover:bg-muted"
                aria-label="비밀번호 표시 전환">👁</button>
            </div>
          </div>
          <div>
            <label for="confirm-password" class="mb-1 block text-sm font-medium">새 비밀번호 확인</label>
            <div class="relative">
              <input id="confirm-password" type="password" placeholder="새 비밀번호 다시 입력" autocomplete="new-password"
                class="w-full rounded-lg border border-border bg-background px-3 py-2.5 pr-10 text-sm outline-none focus:border-primary" />
              <button type="button" onclick="MCUI.togglePassword('confirm-password', this)"
                class="absolute right-2 top-1/2 -translate-y-1/2 grid h-7 w-7 place-items-center rounded text-base hover:bg-muted"
                aria-label="비밀번호 표시 전환">👁</button>
            </div>
          </div>
          <button id="reset-change-btn" type="submit" class="w-full rounded-lg bg-primary py-2.5 text-sm font-semibold text-white hover:opacity-90">비밀번호 변경</button>
        </form>
      </section>
    </div>

    <div class="mt-8 text-sm">
      <a href="login.html" class="text-muted-foreground hover:text-foreground">← 로그인으로 돌아가기</a>
    </div>
  </main>

  <!-- 비밀번호 변경 성공 팝업 (기능명세서 기준 — 정적 UI 단계 누락분을 이 브랜치에서 보완) -->
  <div id="reset-complete-modal" data-modal class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-4">
    <div class="w-full max-w-sm rounded-2xl border border-border bg-surface p-6 text-center shadow-xl">
      <div class="mx-auto grid h-14 w-14 place-items-center rounded-full bg-muted text-3xl">✅</div>
      <h3 class="mt-4 text-lg font-semibold">비밀번호가 변경되었습니다</h3>
      <p class="mt-1 text-sm text-muted-foreground">로그인 화면으로 이동합니다.</p>
      <a href="login.html" class="mt-5 block w-full rounded-lg bg-primary py-2.5 text-sm font-semibold text-white hover:opacity-90">확인</a>
    </div>
  </div>

  <script src="assets/js/ui.js"></script>
  <script src="assets/js/modal.js"></script>
  <script src="assets/js/validate.js"></script>
  <script>
    (function () {
      // STEP 1 — 이메일 유효 시 발송 버튼 활성화
      var s1 = document.getElementById("reset-step1-form");
      var email = document.getElementById("reset-email");
      var sendBtn = document.getElementById("reset-send-btn");
      var sentNote = document.getElementById("reset-sent-note");
      function refresh1() { MCVAL.setEnabled(sendBtn, MCVAL.isEmail(email.value)); }
      email.addEventListener("input", refresh1);
      refresh1();
      s1.addEventListener("submit", function (e) {
        e.preventDefault();
        if (!MCVAL.isEmail(email.value)) return;
        // 발송 완료 안내 노출 + STEP1 비활성화
        sentNote.classList.remove("hidden");
        sentNote.classList.add("flex");
        email.disabled = true;
        MCVAL.setEnabled(sendBtn, false);
      });

      // STEP 2 — 규칙 통과 + 확인 일치 시 변경 버튼 활성화
      var s2 = document.getElementById("reset-step2-form");
      var np = document.getElementById("new-password");
      var cp = document.getElementById("confirm-password");
      var changeBtn = document.getElementById("reset-change-btn");
      function valid2() { return MCVAL.isStrongPassword(np.value) && np.value === cp.value && cp.value.length > 0; }
      function refresh2() { MCVAL.setEnabled(changeBtn, valid2()); }
      np.addEventListener("input", refresh2);
      cp.addEventListener("input", refresh2);
      refresh2();
      s2.addEventListener("submit", function (e) {
        e.preventDefault();
        if (valid2()) MCPModal.open("#reset-complete-modal"); // 성공 팝업 → 확인 시 login.html
      });
    })();
  </script>
</body>
</html>
