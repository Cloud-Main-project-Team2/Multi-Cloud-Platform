<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>리소스 조회 · 서비스 소개 · MultiCloud Ops</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: {
      background:"var(--background)", foreground:"var(--foreground)", surface:"var(--surface)",
      muted:"var(--muted)", "muted-foreground":"var(--muted-foreground)", border:"var(--border)",
      sidebar:"var(--sidebar)", "sidebar-accent":"var(--sidebar-accent)",
      primary:"var(--primary)", sky:"var(--sky)", aero:"var(--aero)", yellow:"var(--yellow)", "cta-text":"var(--cta-text)"
    }, maxWidth:{ content:"1180px" } } } };
  </script>
  <link rel="icon" type="image/png" href="assets/imgs/logo-navy.png" />
  <link rel="stylesheet" href="assets/css/theme.css" />
</head>
<body class="min-h-screen">

  <div class="mx-auto flex max-w-content items-center justify-between px-6 py-5">
    <a href="main.html" class="flex items-center gap-2">
      <img src="assets/imgs/logo.png" alt="" class="h-8 w-8 object-contain" />
      <span class="text-lg font-bold" data-service-name>MultiCloud Ops</span>
    </a>
    <div class="flex items-center gap-2">
      <button type="button" data-theme-toggle onclick="MCUI.toggleTheme()" class="grid h-9 w-9 place-items-center rounded-lg text-lg hover:bg-muted" aria-label="테마 전환">🌙</button>
      <a href="login.html" class="rounded-lg px-3 py-2 text-sm font-medium hover:bg-muted">로그인</a>
      <a href="signup.html" class="rounded-lg bg-primary px-4 py-2 text-sm font-semibold text-white hover:opacity-90">회원가입</a>
    </div>
  </div>

  <main class="mx-auto grid max-w-content gap-8 px-6 py-8 md:grid-cols-[240px_1fr]">
    <aside>
      <p class="mb-3 px-3 text-xs font-semibold uppercase tracking-wide text-muted-foreground">서비스 소개</p>
      <nav class="space-y-1">
        <a href="intro-dashboard.html" class="flex items-center justify-between rounded-lg border-l-2 border-transparent px-3 py-2 text-sm text-muted-foreground hover:bg-muted">대시보드</a>
        <a href="intro-inventory.html" class="flex items-center justify-between rounded-lg border-l-2 border-primary bg-muted px-3 py-2 text-sm font-semibold">리소스 조회</a>
        <a href="intro-provisioning.html" class="flex items-center justify-between rounded-lg border-l-2 border-transparent px-3 py-2 text-sm text-muted-foreground hover:bg-muted">프로비저닝</a>
        <a href="intro-cost.html" class="flex items-center justify-between rounded-lg border-l-2 border-transparent px-3 py-2 text-sm text-muted-foreground hover:bg-muted">비용 관리 <span class="rounded border border-yellow px-1 text-[11px] text-yellow">준비 중</span></a>
        <a href="intro-logs.html" class="flex items-center justify-between rounded-lg border-l-2 border-transparent px-3 py-2 text-sm text-muted-foreground hover:bg-muted">로그 통합 관리 <span class="rounded border border-yellow px-1 text-[11px] text-yellow">준비 중</span></a>
      </nav>
    </aside>

    <section>
      <h1 class="text-3xl font-extrabold">리소스 조회</h1>
      <p class="mt-3 text-lg text-muted-foreground">AWS·Azure·GCP의 모든 자원을 하나의 목록에서 필터·검색합니다.</p>

      <div class="mt-6 grid h-56 place-items-center rounded-2xl border border-dashed border-border bg-surface text-sm text-muted-foreground">
        소개 이미지 (준비 중)
      </div>

      <ul class="mt-6 space-y-3 text-sm">
        <li class="flex gap-2"><span class="text-primary">•</span> 클라우드·상태·리전·태그로 필터링하는 통합 인벤토리</li>
        <li class="flex gap-2"><span class="text-primary">•</span> 리소스명·ID·서비스·계정 기준 통합 검색</li>
        <li class="flex gap-2"><span class="text-primary">•</span> 리소스 상세 확인과 start/stop/delete 액션</li>
      </ul>

      <a href="login.html" class="mt-8 inline-block rounded-xl bg-primary px-6 py-3 text-base font-semibold text-white hover:opacity-90">로그인하고 시작하기 →</a>
      <p class="mt-3 text-xs text-muted-foreground">* 소개 문구·이미지는 확정 전 자리표시자입니다.</p>
    </section>
  </main>

  <script src="assets/js/ui.js"></script>
</body>
</html>
