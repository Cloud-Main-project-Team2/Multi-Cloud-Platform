<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>보고서 작성 · MultiCloud Ops</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: {
      background:"var(--background)", foreground:"var(--foreground)", surface:"var(--surface)",
      muted:"var(--muted)", "muted-foreground":"var(--muted-foreground)", border:"var(--border)",
      sidebar:"var(--sidebar)", "sidebar-accent":"var(--sidebar-accent)",
      primary:"var(--primary)", sky:"var(--sky)", aero:"var(--aero)", yellow:"var(--yellow)", "cta-text":"var(--cta-text)"
    } } } };
  </script>
  <link rel="icon" type="image/png" href="assets/imgs/logo-navy.png" />
  <link rel="stylesheet" href="assets/css/theme.css" />
  <link rel="stylesheet" href="assets/css/shell.css" />
  <!-- 데모 인증 가드: 세션 없으면 login.html로 리다이렉트(본문 렌더 전) -->
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth-guard.js"></script>
  <!-- 오류 리포터: window.onerror/rejection을 서버 로그로 보낸다. 다른 스크립트보다 먼저 로드한다. -->
  <script src="assets/js/error-reporter.js"></script>
  <!-- 보고서 목업 데이터 — 비용 API가 아직 없어 비용/미사용/인수인계는 이 목업을 쓴다.
       사용률만 실 API로 교체됨(assets/js/reports.js 참고). -->
  <script src="assets/js/reports-data.js"></script>
</head>
<body>
  <div class="app-shell">

    <!-- ===== COMM-01 사이드바 ===== -->
    <aside class="sidebar">
      <a href="main.html" class="sidebar__brand">
        <img src="assets/imgs/logo.png" alt="" class="h-8 w-8 object-contain" />
        <span data-service-name>MultiCloud Ops</span>
      </a>

      <nav class="sidebar__nav">
        <a href="dashboard.html" class="nav-item"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="nav-ico"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>대시보드</a>
        <a href="inventory.html" class="nav-item"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="nav-ico"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>인벤토리</a>
        <div class="nav-group" data-nav-group="provisioning">
          <div class="nav-group__row">
            <a href="provisioning.html" class="nav-item nav-group__link"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="nav-ico"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>프로비저닝</a>
            <button type="button" class="nav-group__toggle" aria-expanded="false" aria-label="보안그룹 하위 메뉴 펼치기/접기"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nav-group__chevron"><polyline points="6 9 12 15 18 9"/></svg></button>
          </div>
          <div class="nav-group__submenu hidden">
            <a href="security-groups.html" class="nav-item nav-item--sub"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="nav-ico"><path d="M12 2 4 5v6c0 5.25 3.4 9.74 8 11 4.6-1.26 8-5.75 8-11V5z"/></svg>보안그룹</a>
          </div>
        </div>
        <a href="mypage.html" class="nav-item"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="nav-ico"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>마이페이지</a>

        <div class="sidebar__divider" aria-hidden="true"></div>
        <a href="cost.html" class="nav-item"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="nav-ico"><path d="M20 12V8H6a2 2 0 0 1-2-2c0-1.1.9-2 2-2h12v4"/><path d="M4 6v12a2 2 0 0 0 2 2h14v-4"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>비용 관리</a>
        <a href="reports.html" class="nav-item active"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="nav-ico"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/></svg>보고서 작성</a>
      </nav>

      <div class="sidebar__utils">
        <button type="button" data-theme-toggle onclick="MCUI.toggleTheme()" class="topbar__btn" aria-label="테마 전환">🌙</button>
        <div class="lang-dd">
          <button type="button" class="lang-dd__btn topbar__btn" aria-haspopup="listbox" aria-expanded="false" aria-label="언어 선택">
            <svg class="lang-dd__globe" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
          </button>
        </div>
        <span class="bell topbar__btn" role="button" aria-label="알림"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="bell-ico"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="bell__badge" style="display:none">0</span></span>
      </div>

      <div class="sidebar__foot">
        <div class="sidebar__remaining"><span class="sidebar__remaining-label">세션 남은 시간 </span><span class="sidebar__remaining-value">-</span></div>
        <div class="sidebar__email">name@company.com</div>
        <button type="button" class="sidebar__logout">로그아웃</button>
      </div>
    </aside>

    <!-- ===== 본문 ===== -->
    <div class="main-area">
      <div class="content">
        <div>
          <h1 class="text-2xl font-bold">보고서 작성</h1>
          <p class="mt-1 text-sm text-muted-foreground">리소스·비용 현황을 보고서로 정리해 내려받습니다</p>
        </div>

        <!-- 보고서 생성 -->
        <div class="mt-4 rounded-2xl border border-border bg-surface p-5">
          <div class="flex flex-wrap items-end justify-between gap-4">
            <div>
              <p class="text-sm font-semibold">포함할 클라우드</p>
              <div class="mt-2 flex flex-wrap gap-2">
                <label data-select-card class="flex cursor-pointer items-center gap-2 rounded-lg border border-border px-3 py-2 text-sm">
                  <input type="checkbox" data-report-cloud="aws" checked />
                  <img src="assets/imgs/aws.png" alt="" class="h-4 w-auto align-middle" /> AWS
                </label>
                <label data-select-card class="flex cursor-pointer items-center gap-2 rounded-lg border border-border px-3 py-2 text-sm">
                  <input type="checkbox" data-report-cloud="azure" checked />
                  <img src="assets/imgs/azure.png" alt="" class="h-4 w-auto align-middle" /> Azure
                </label>
                <label data-select-card class="flex cursor-pointer items-center gap-2 rounded-lg border border-border px-3 py-2 text-sm">
                  <input type="checkbox" data-report-cloud="gcp" checked />
                  <img src="assets/imgs/gcp.png" alt="" class="h-4 w-auto align-middle" /> GCP
                </label>
              </div>
            </div>

            <div>
              <p class="text-sm font-semibold">주기</p>
              <select id="report-period" class="mt-2 rounded-lg border border-border bg-background px-3 py-2 text-sm">
                <option value="DAILY">일간</option>
                <option value="WEEKLY" selected>주간</option>
                <option value="MONTHLY">월간</option>
                <option value="HALF_YEARLY">반기 (상반기)</option>
              </select>
            </div>

            <div class="flex flex-col items-end gap-1">
              <button type="button" id="report-generate-btn" class="rounded-xl bg-primary px-5 py-2.5 text-sm font-semibold text-white hover:opacity-90 disabled:cursor-not-allowed disabled:opacity-50">보고서 생성</button>
              <span id="report-generate-status" class="text-xs text-muted-foreground"></span>
            </div>
          </div>
          <p class="mt-3 text-xs text-muted-foreground">선택한 클라우드만 포함해 생성됩니다. 현재 <span id="report-cloud-count">3</span>개 선택됨.</p>
        </div>

        <!-- 최근 보고서 요약 -->
        <div class="mt-4 rounded-2xl border border-border bg-surface p-5">
          <div class="flex flex-wrap items-center justify-between gap-2">
            <p class="text-sm font-semibold">최근 보고서 요약</p>
            <span id="report-summary-period" class="text-xs text-muted-foreground">—</span>
          </div>
          <div class="mt-3 grid gap-4 sm:grid-cols-2 lg:grid-cols-4">
            <div class="rounded-xl bg-muted p-4">
              <p class="text-sm text-muted-foreground">전체 비용</p>
              <p class="mt-1 text-2xl font-bold" id="report-sum-cost">—</p>
              <p class="mt-1 text-xs text-muted-foreground" id="report-sum-cost-delta">—</p>
            </div>
            <div class="rounded-xl bg-muted p-4">
              <p class="text-sm text-muted-foreground">미사용 리소스</p>
              <p class="mt-1 text-2xl font-bold" id="report-sum-unused">—</p>
              <p class="mt-1 text-xs text-muted-foreground" id="report-sum-unused-sub">—</p>
            </div>
            <div class="rounded-xl bg-muted p-4">
              <p class="text-sm text-muted-foreground">사용률 90% 초과</p>
              <p class="mt-1 text-2xl font-bold" id="report-sum-hot">—</p>
              <p class="mt-1 text-xs text-muted-foreground" id="report-sum-hot-sub">—</p>
            </div>
            <div class="rounded-xl bg-muted p-4">
              <p class="flex items-center gap-1.5 text-sm text-muted-foreground">인수인계 항목 <span class="rounded border border-yellow px-1 text-[10px] text-yellow">예시</span></p>
              <p class="mt-1 text-2xl font-bold" id="report-sum-handover">—</p>
              <p class="mt-1 text-xs text-muted-foreground" id="report-sum-handover-sub">—</p>
            </div>
          </div>
        </div>

        <!-- 생성 이력 / 정기 발송 -->
        <div class="mt-4 rounded-2xl border border-border bg-surface p-5">
          <div class="flex gap-4 border-b border-border" role="tablist" aria-label="보고서 관리">
            <button type="button" data-report-tab="history" role="tab" aria-selected="true" class="border-b-2 border-primary px-1 pb-2.5 text-sm font-medium text-primary">생성 이력</button>
            <button type="button" data-report-tab="schedule" role="tab" aria-selected="false" class="border-b-2 border-transparent px-1 pb-2.5 text-sm font-medium text-muted-foreground">정기 발송</button>
          </div>

          <!-- 생성 이력 -->
          <div id="report-panel-history" class="mt-4">
            <div class="overflow-x-auto">
              <table class="w-full text-left text-sm">
                <thead class="text-xs text-muted-foreground">
                  <tr class="border-b border-border">
                    <th class="py-2 pr-4 font-medium">기간</th>
                    <th class="py-2 pr-4 font-medium">주기</th>
                    <th class="py-2 pr-4 font-medium">포함 클라우드</th>
                    <th class="py-2 text-right font-medium">동작</th>
                  </tr>
                </thead>
                <tbody id="report-history-body">
                  <tr><td class="py-3 text-muted-foreground" colspan="4">불러오는 중…</td></tr>
                </tbody>
              </table>
            </div>
          </div>

          <!-- 정기 발송 (§4.3 마이페이지 연동 설정) -->
          <div id="report-panel-schedule" class="mt-4 hidden max-w-md">
            <div class="space-y-4">
              <!-- 지금 메일 정기 발송이 켜져 있는지 한눈에 보여준다 — 저장 버튼을 눌렀던 그 순간이
                   지나면 켜져 있는지 알 방법이 없다는 문제(2026-09-19 확인)를 고치기 위함. -->
              <div id="report-email-status" class="hidden rounded-lg border border-sky bg-muted px-3 py-2 text-xs"></div>
              <div>
                <p class="text-sm font-semibold">다운로드 방식</p>
                <div class="mt-2 flex gap-2">
                  <label data-select-card class="flex flex-1 cursor-pointer items-center gap-2 rounded-lg border border-border px-3 py-2 text-sm">
                    <input type="radio" name="report-delivery" value="WEB" checked /> 웹 다운로드
                  </label>
                  <label data-select-card class="flex flex-1 cursor-pointer items-center gap-2 rounded-lg border border-border px-3 py-2 text-sm">
                    <input type="radio" name="report-delivery" value="EMAIL" /> 메일 전송
                  </label>
                </div>
              </div>
              <!-- 웹 다운로드: 주기 개념 없음 — 정기 발송이 아니라 그 자리에서 즉시 받는다. -->
              <div id="report-web-download-field">
                <button type="button" id="report-web-download-btn" class="rounded-xl bg-primary px-4 py-2 text-sm font-semibold text-white hover:opacity-90">최신 보고서 다운로드</button>
              </div>
              <!-- 메일 전송: 주기적으로 보내야 하므로 수신 주소·주기 설정이 필요하다. -->
              <div id="report-email-schedule-fields" class="hidden space-y-4">
                <div>
                  <p class="text-sm font-semibold">수신 메일 주소</p>
                  <input type="email" id="report-email-input" placeholder="name@company.com" class="mt-2 w-full rounded-lg border border-border bg-background px-3 py-2 text-sm" />
                </div>
                <div>
                  <p class="text-sm font-semibold">발송 주기</p>
                  <select id="report-schedule-period" class="mt-2 w-full rounded-lg border border-border bg-background px-3 py-2 text-sm">
                    <option value="DAILY">일간</option>
                    <option value="WEEKLY" selected>주간</option>
                    <option value="MONTHLY">월간</option>
                    <option value="HALF_YEARLY">반기</option>
                  </select>
                  <!-- 저장 즉시 보내는 게 아니라 매일 정해진 시각에만 발송 대상을 확인한다는 걸
                       안내한다 — 안 그러면 "저장했는데 왜 안 오지"로 오해하기 쉽다(2026-09-19 확인). -->
                  <p id="report-send-timing" class="mt-1 text-xs text-muted-foreground"></p>
                </div>
                <div class="flex items-center gap-3">
                  <button type="button" id="report-settings-save" class="rounded-xl bg-primary px-4 py-2 text-sm font-semibold text-white hover:opacity-90">저장</button>
                  <button type="button" id="report-settings-disable" class="hidden rounded-xl border border-border px-4 py-2 text-sm font-semibold text-muted-foreground hover:bg-muted">발송 해제</button>
                  <span id="report-settings-saved" class="text-xs text-muted-foreground"></span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="assets/js/ui.js"></script>
  <script src="assets/js/prov-tracker.js"></script>
  <script src="assets/js/reports.js"></script>
</body>
</html>
