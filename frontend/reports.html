<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>보고서 작성 · MultiCloud Ops</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: {
      background:"var(--background)", foreground:"var(--foreground)", surface:"var(--surface)",
      muted:"var(--muted)", "muted-foreground":"var(--muted-foreground)", border:"var(--border)",
      sidebar:"var(--sidebar)", "sidebar-accent":"var(--sidebar-accent)",
      primary:"var(--primary)", sky:"var(--sky)", aero:"var(--aero)", yellow:"var(--yellow)", "cta-text":"var(--cta-text)"
    } } } };
  </script>
  <link rel="icon" type="image/png" href="assets/imgs/logo-navy.png" />
  <link rel="stylesheet" href="assets/css/theme.css" />
  <link rel="stylesheet" href="assets/css/shell.css" />
  <!-- 데모 인증 가드: 세션 없으면 login.html로 리다이렉트(본문 렌더 전) -->
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth-guard.js"></script>
  <!-- 오류 리포터: window.onerror/rejection을 서버 로그로 보낸다. 다른 스크립트보다 먼저 로드한다. -->
  <script src="assets/js/error-reporter.js"></script>
</head>
<body>
  <div class="app-shell">

    <!-- ===== COMM-01 사이드바 ===== -->
    <aside class="sidebar">
      <a href="main.html" class="sidebar__brand">
        <img src="assets/imgs/logo.png" alt="" class="h-8 w-8 object-contain" />
        <span data-service-name>MultiCloud Ops</span>
      </a>

      <nav class="sidebar__nav">
        <a href="dashboard.html" class="nav-item">📊 대시보드</a>
        <a href="inventory.html" class="nav-item">🗂️ 인벤토리</a>
        <a href="provisioning.html" class="nav-item">⚡ 프로비저닝</a>
        <a href="mypage.html" class="nav-item">👤 마이페이지</a>

        <div class="sidebar__divider" aria-hidden="true"></div>
        <a href="cost.html" class="nav-item">💰 비용 관리</a>
        <a href="reports.html" class="nav-item active">📝 보고서 작성</a>
      </nav>

      <div class="sidebar__utils">
        <button type="button" data-theme-toggle onclick="MCUI.toggleTheme()" class="topbar__btn" aria-label="테마 전환">🌙</button>
        <div class="lang-dd">
          <button type="button" class="lang-dd__btn topbar__btn" aria-haspopup="listbox" aria-expanded="false" aria-label="언어 선택">
            <svg class="lang-dd__globe" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
            <span class="lang-dd__current">KOR</span>
          </button>
        </div>
        <span class="bell topbar__btn" role="button" aria-label="알림">🔔<span class="bell__badge">3</span></span>
      </div>

      <div class="sidebar__foot">
        <div class="sidebar__remaining"><span class="sidebar__remaining-label">세션 남은 시간 </span><span class="sidebar__remaining-value">-</span></div>
        <div class="sidebar__email">name@company.com</div>
        <button type="button" class="sidebar__logout">로그아웃</button>
      </div>
    </aside>

    <!-- ===== 본문 ===== -->
    <div class="main-area">
      <div class="content">
        <div>
          <h1 class="text-2xl font-bold">보고서 작성</h1>
          <p class="mt-1 text-sm text-muted-foreground">리소스·비용 현황을 보고서로 정리해 내려받습니다</p>
        </div>

        <!-- 담당 팀원이 채울 자리 — 현재는 페이지만 열어 둔 상태 -->
        <div class="mt-6 grid place-items-center rounded-2xl border border-dashed border-border bg-surface px-6 py-16 text-center">
          <div class="text-4xl">📝</div>
          <p class="mt-3 text-base font-semibold">준비 중인 기능입니다</p>
          <p class="mt-1 max-w-md text-sm text-muted-foreground">보고서 작성 화면은 곧 제공될 예정입니다.</p>
        </div>
      </div>
    </div>
  </div>

  <script src="assets/js/ui.js"></script>
</body>
</html>
