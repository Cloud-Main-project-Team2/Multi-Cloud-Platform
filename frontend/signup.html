<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>회원가입 · MultiCloud Ops</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: {
        background: "var(--background)", foreground: "var(--foreground)", surface: "var(--surface)",
        muted: "var(--muted)", "muted-foreground": "var(--muted-foreground)", border: "var(--border)",
        sidebar: "var(--sidebar)", "sidebar-accent": "var(--sidebar-accent)",
        primary: "var(--primary)", sky: "var(--sky)", aero: "var(--aero)",
        yellow: "var(--yellow)", "cta-text": "var(--cta-text)"
      }, maxWidth: { content: "1180px" } } }
    };
  </script>
  <link rel="stylesheet" href="assets/css/theme.css" />
</head>
<body class="min-h-screen">

  <!-- 상단 바: 로고(홈) + 테마 토글 -->
  <div class="mx-auto flex max-w-content items-center justify-between px-6 py-5">
    <a href="main.html" class="flex items-center gap-2">
      <span class="grid h-8 w-8 place-items-center rounded-lg bg-primary text-white">☁️</span>
      <span class="text-lg font-bold" data-service-name>MultiCloud Ops</span>
    </a>
    <button type="button" data-theme-toggle onclick="MCUI.toggleTheme()"
      class="grid h-9 w-9 place-items-center rounded-lg text-lg hover:bg-muted" aria-label="테마 전환">🌙</button>
  </div>

  <main class="mx-auto max-w-content px-6 py-8 md:py-12">

    <!-- 회원가입 폼 (1열) -->
    <div class="mx-auto max-w-md">
      <div class="rounded-2xl border border-border bg-surface p-8 shadow-sm">
        <h1 class="text-2xl font-bold">회원가입</h1>
        <p class="mt-1 text-sm text-muted-foreground"><span data-service-name>MultiCloud Ops</span> 계정을 만듭니다.</p>

        <form class="mt-6 space-y-4" onsubmit="return false">
          <!-- 이메일 + 중복 확인 -->
          <div>
            <label for="email" class="mb-1 block text-sm font-medium">이메일</label>
            <div class="flex gap-2">
              <input id="email" type="email" placeholder="name@company.com" autocomplete="username"
                class="w-full rounded-lg border border-border bg-background px-3 py-2.5 text-sm outline-none focus:border-primary" />
              <button type="button" class="shrink-0 rounded-lg border border-border bg-surface px-3 py-2.5 text-sm font-medium hover:bg-muted">중복 확인</button>
            </div>
          </div>

          <!-- 비밀번호 -->
          <div>
            <label for="password" class="mb-1 block text-sm font-medium">비밀번호</label>
            <div class="relative">
              <input id="password" type="password" placeholder="비밀번호" autocomplete="new-password"
                class="w-full rounded-lg border border-border bg-background px-3 py-2.5 pr-10 text-sm outline-none focus:border-primary" />
              <button type="button" onclick="MCUI.togglePassword('password', this)"
                class="absolute right-2 top-1/2 -translate-y-1/2 grid h-7 w-7 place-items-center rounded text-base hover:bg-muted"
                aria-label="비밀번호 표시 전환">👁</button>
            </div>
            <p class="mt-1 text-xs text-muted-foreground">8자 이상, 영문·숫자·기호 중 2종 이상</p>
          </div>

          <!-- 비밀번호 확인 -->
          <div>
            <label for="confirm-password" class="mb-1 block text-sm font-medium">비밀번호 확인</label>
            <div class="relative">
              <input id="confirm-password" type="password" placeholder="비밀번호 다시 입력" autocomplete="new-password"
                class="w-full rounded-lg border border-border bg-background px-3 py-2.5 pr-10 text-sm outline-none focus:border-primary" />
              <button type="button" onclick="MCUI.togglePassword('confirm-password', this)"
                class="absolute right-2 top-1/2 -translate-y-1/2 grid h-7 w-7 place-items-center rounded text-base hover:bg-muted"
                aria-label="비밀번호 표시 전환">👁</button>
            </div>
          </div>

          <!-- 이름 -->
          <div>
            <label for="name" class="mb-1 block text-sm font-medium">이름</label>
            <input id="name" type="text" placeholder="이름" autocomplete="name"
              class="w-full rounded-lg border border-border bg-background px-3 py-2.5 text-sm outline-none focus:border-primary" />
          </div>

          <!-- 소속 (드롭다운 회사/개인 + 소속단체명, 생략 가능) -->
          <div>
            <label class="mb-1 block text-sm font-medium">소속 <span class="font-normal text-muted-foreground">(생략 가능)</span></label>
            <div class="flex gap-2">
              <select class="shrink-0 rounded-lg border border-border bg-background px-3 py-2.5 text-sm outline-none focus:border-primary">
                <option>회사</option>
                <option>개인</option>
              </select>
              <input type="text" placeholder="소속단체명"
                class="w-full rounded-lg border border-border bg-background px-3 py-2.5 text-sm outline-none focus:border-primary" />
            </div>
          </div>

          <button type="submit" class="w-full rounded-lg bg-primary py-2.5 text-sm font-semibold text-white hover:opacity-90">가입하기</button>
        </form>

        <p class="mt-6 text-center text-sm text-muted-foreground">
          이미 회원이신가요? <a href="login.html" class="font-medium text-primary hover:underline">로그인</a>
        </p>
      </div>
    </div>

    <!-- ===== 화면 상태 미리보기: 모달 2종 (화면설계서처럼 나란히 정적으로) ===== -->
    <div class="mx-auto mt-14 max-w-content">
      <div class="mb-4 flex items-center gap-2 text-sm text-muted-foreground">
        <span class="h-px flex-1 bg-border"></span>
        화면 상태 미리보기 — 아래 두 모달은 실제로는 상황에 따라 뜨는 팝업입니다(정적 표시)
        <span class="h-px flex-1 bg-border"></span>
      </div>

      <div class="grid gap-6 md:grid-cols-2">
        <!-- 소셜 가입 추가정보 모달 -->
        <div class="rounded-xl border border-dashed border-border p-4">
          <p class="mb-3 text-xs font-medium text-muted-foreground">① 소셜 가입 추가정보 모달</p>
          <div class="rounded-2xl border border-border bg-surface p-6 shadow-lg">
            <h3 class="text-lg font-semibold">추가 정보 입력</h3>
            <p class="mt-1 text-sm text-muted-foreground">Google 계정으로 처음 가입하시는군요. 이름과 소속만 입력하면 가입이 완료됩니다.</p>
            <div class="mt-4 space-y-3">
              <div>
                <label class="mb-1 block text-sm font-medium">이름</label>
                <input type="text" placeholder="이름"
                  class="w-full rounded-lg border border-border bg-background px-3 py-2.5 text-sm outline-none focus:border-primary" />
              </div>
              <div>
                <label class="mb-1 block text-sm font-medium">소속 <span class="font-normal text-muted-foreground">(생략 가능)</span></label>
                <div class="flex gap-2">
                  <select class="shrink-0 rounded-lg border border-border bg-background px-3 py-2.5 text-sm outline-none focus:border-primary">
                    <option>회사</option>
                    <option>개인</option>
                  </select>
                  <input type="text" placeholder="소속단체명"
                    class="w-full rounded-lg border border-border bg-background px-3 py-2.5 text-sm outline-none focus:border-primary" />
                </div>
              </div>
            </div>
            <button type="button" class="mt-5 w-full rounded-lg bg-primary py-2.5 text-sm font-semibold text-white hover:opacity-90">가입 완료</button>
          </div>
        </div>

        <!-- 가입완료 팝업 -->
        <div class="rounded-xl border border-dashed border-border p-4">
          <p class="mb-3 text-xs font-medium text-muted-foreground">② 가입완료 팝업</p>
          <div class="rounded-2xl border border-border bg-surface p-6 text-center shadow-lg">
            <div class="mx-auto grid h-14 w-14 place-items-center rounded-full bg-muted text-3xl">✅</div>
            <h3 class="mt-4 text-lg font-semibold">가입이 완료되었습니다</h3>
            <p class="mt-1 text-sm text-muted-foreground">로그인 화면으로 이동합니다.</p>
            <a href="login.html" class="mt-5 block w-full rounded-lg bg-primary py-2.5 text-sm font-semibold text-white hover:opacity-90">확인</a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="assets/js/ui.js"></script>
</body>
</html>
